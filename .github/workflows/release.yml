name: Release macOS

on:
  push:
    branches: [main]

# Needed to create GitHub Releases and upload the built DMG.
permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build & publish macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Full install (runs postinstall electron-builder install-app-deps) so the
      # native binaries (onnxruntime-node, ffmpeg-static) are set up for Electron.
      - run: pnpm install --frozen-lockfile

      - name: Read app version
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "tag=v$(node -p "require('./package.json').version")-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build macOS DMG
        run: pnpm build:mac
        env:
          # No signing certificate in CI — build an unsigned app rather than
          # failing while trying to auto-discover one.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Baked into the app so the in-app updater (src/main/update) can
          # detect when a newer release is published.
          SOCRASH_BUILD_TAG: ${{ steps.meta.outputs.tag }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Socrash v${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated macOS build from `main` (${{ github.sha }}).

            **Download the `.dmg` below** and drag Socrash to Applications
            (Apple Silicon). The app is ad-hoc signed but not notarized, so
            macOS still quarantines downloads. On first launch, **right-click
            the app → Open**.

            If macOS still refuses to open it, clear the download quarantine:
            ```bash
            xattr -cr /Applications/Socrash.app
            ```

            Already have Socrash installed? It will offer this build as an
            in-app update automatically.
          files: |
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: true
